services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lifesandbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifesandbox"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lifesandbox
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
