[project]
name = "life-sandbox-backend"
version = "0.1.0"
description = "Local-first conversational decision intelligence backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.37,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "PyJWT[crypto]>=2.10,<3",
  "langchain-core>=0.3.30,<1", "langgraph>=0.2.60,<1", "langchain-openai>=0.3.14,<1",
  "langfuse>=2.57,<4", "sentry-sdk[fastapi]>=2.20,<3", "pypdf>=5.1,<7", "boto3>=1.36,<2",
]

[project.optional-dependencies]
browser = ["browser-use>=0.13,<0.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1", "pyright>=1.1.392,<2", "hypothesis>=6.122,<7", "aiosqlite>=0.20,<1", "moto[s3]>=5.0,<6"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["app"]
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["app"]

