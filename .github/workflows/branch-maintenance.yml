name: Branch maintenance

on:
  push:
    branches:
      - fix/security-routing-ci-2026-10-31

permissions:
  contents: write

jobs:
  normalize:
    if: "!contains(github.event.head_commit.message, '[autofix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
      - name: Normalize Python formatting and imports
        run: |
          uv lock
          uv sync --locked
          uv run ruff check --fix app scripts tests || true
          uv run ruff format app scripts tests
      - name: Refresh frontend lockfile with security overrides
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated formatting and lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts tests pyproject.toml frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "[autofix] format Python and refresh frontend lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
