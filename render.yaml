services:
  - type: web
    name: lifesandbox-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./deploy/render-start.sh
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: "10000"
      - key: AUTH_MODE
        value: jwt
      - key: AUTH_ISSUER
        value: life-sandbox
      - key: AUTH_AUDIENCE
        value: life-sandbox-web
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: "75"
      - key: TELEGRAM_POLLING_ENABLED
        value: "false"
      - key: BROWSER_USE_ENABLED
        value: "false"
      - key: RESEARCH_PROVIDER
        value: disabled
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_FALLBACK_MODEL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_AUTH_CALLBACK_URL
        sync: false
      - key: GOOGLE_AUTH_FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_HOST
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: LLM_FALLBACK_PROVIDER
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        sync: false
      - key: LLM_MAX_TOKENS
        sync: false
      - key: CHAT_REQUEST_TIMEOUT_SECONDS
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: MEM0_HOST
        sync: false
      - key: MEM0_SEARCH_TIMEOUT_SECONDS
        sync: false
      - key: MEM0_ADD_TIMEOUT_SECONDS
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        sync: false
      - key: NEBIUS_MODEL
        sync: false
      - key: GOOGLE_OAUTH_CALLBACK_URL
        sync: false
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
