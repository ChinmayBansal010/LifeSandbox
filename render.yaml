      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: NEON_STORAGE_BUCKET
        sync: false
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: EMBEDDING_DIMENSIONS
        sync: false
      - key: UPLOAD_MAX_BYTES
