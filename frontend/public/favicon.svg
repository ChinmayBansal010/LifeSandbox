<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">LifeSandbox</title>
  <desc id="desc">A living sprout growing inside an open sandbox, representing a safe space to explore and shape life's possibilities.</desc>
  <defs>
    <linearGradient id="bg" x1="6" y1="4" x2="58" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202B46"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="box" x1="13" y1="28" x2="51" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A99BFF"/>
      <stop offset="1" stop-color="#7668E8"/>
    </linearGradient>
    <linearGradient id="leaf" x1="23" y1="10" x2="42" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7F7D8"/>
      <stop offset="1" stop-color="#48D6B0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#bg)"/>

  <!-- Open sandbox: a contained space for experimenting with life. -->
  <path d="M11 31.5 32 20l21 11.5v17L32 60 11 48.5z" fill="#17243A"/>
  <path d="M11 31.5 32 43l21-11.5" fill="none" stroke="url(#box)" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M11 31.5v17L32 60V43" fill="none" stroke="#8D80F4" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M53 31.5v17L32 60" fill="none" stroke="#6F65D9" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- Life: one growing stem with two distinct leaves. -->
  <path d="M32 42V26" fill="none" stroke="#65E0B9" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M31.8 30.5c-8.8.2-13.5-4.2-12.5-11.2 7.6-.6 13.1 3.5 12.5 11.2Z" fill="url(#leaf)"/>
  <path d="M32 25.5c.9-7.8 6.2-12.2 13.1-10.7.4 7.4-4.3 11.9-13.1 10.7Z" fill="url(#leaf)"/>
  <path d="M21.7 20.5c3.3 1.4 6.1 3.8 8.4 7" fill="none" stroke="#E7FFF5" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
  <path d="M42.2 17.7c-3.8 1.5-6.5 4-8.9 7.4" fill="none" stroke="#E7FFF5" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
  <path d="M25 42h14" stroke="#65E0B9" stroke-width="2.4" stroke-linecap="round"/>
</svg>