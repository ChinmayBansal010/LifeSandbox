<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">LifeSandbox — conversation to action</title>
  <defs>
    <linearGradient id="surface" x1="7" y1="5" x2="57" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202A43"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="flow" x1="21" y1="25" x2="43" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A99BFF"/>
      <stop offset="1" stop-color="#5DE0C1"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#surface)"/>

  <!-- A conversation card: the starting point for an idea. -->
  <rect x="10.5" y="11" width="27" height="22" rx="6.5"
        fill="#293650" stroke="#C7D2FE" stroke-width="2.5"/>
  <path d="M17 33v4.5l6-4.5" fill="#293650" stroke="#C7D2FE"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="18" cy="22" r="1.8" fill="#A99BFF"/>
  <circle cx="24" cy="22" r="1.8" fill="#A99BFF"/>
  <circle cx="30" cy="22" r="1.8" fill="#A99BFF"/>

  <!-- The route from a conversation into a concrete next step. -->
  <path d="M31 32.5c1.5 4.8 4.1 6.3 8.1 6.3" fill="none"
        stroke="url(#flow)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="m35.8 35.7 3.7 3.1-3.7 3.1" fill="none"
        stroke="#5DE0C1" stroke-width="2.6" stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- A task card with a completed action. -->
  <rect x="31.5" y="39" width="22" height="15" rx="5"
        fill="#5DE0C1"/>
  <path d="m37.5 46.5 3.2 3 6.8-7" fill="none"
        stroke="#102B32" stroke-width="3" stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>